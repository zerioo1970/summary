<text x="608" y="136" fill="#9399b2" font-size="12">契约：只核对名字和形状，不搬运东西</text>
<text x="54" y="672" fill="#7f849c" font-size="12">装配在每次渲染时完成，此刻没有任何代码被执行 —— 只是把函数交付到位，像把电线牵到开关。</text>
