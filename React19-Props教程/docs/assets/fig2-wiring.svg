<text x="24" y="40" fill="#89b4fa" font-size="17" font-weight="bold">图 2　装配线 —— 渲染时发生，方向：父 -&gt; 子（把函数交下去）</text>
<rect x="40" y="122" width="500" height="19" fill="#89b4fa" opacity="0.09" rx="3"/>
<rect x="40" y="182" width="500" height="19" fill="#89b4fa" opacity="0.14" rx="3"/>
