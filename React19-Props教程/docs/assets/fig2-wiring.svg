<text xml:space="preserve" x="54" y="116" fill="#d4d4d4"><tspan fill="#569cd6">type</tspan> <tspan fill="#4ec9b0">TaskCardProps</tspan> = {</text>
<text xml:space="preserve" x="44" y="136" fill="#585b70" text-anchor="end">4</text>
<text xml:space="preserve" x="54" y="136" fill="#d4d4d4">  <tspan fill="#ffd479" font-weight="bold">onToggle</tspan>: () =&gt; <tspan fill="#569cd6">void</tspan>;</text>
<text xml:space="preserve" x="44" y="156" fill="#585b70" text-anchor="end">5</text>
<text xml:space="preserve" x="54" y="156" fill="#d4d4d4">};</text>
<text xml:space="preserve" x="44" y="176" fill="#585b70" text-anchor="end">6</text>
<text xml:space="preserve" x="44" y="196" fill="#585b70" text-anchor="end">7</text>
<text xml:space="preserve" x="54" y="196" fill="#d4d4d4"><tspan fill="#569cd6">function</tspan> <tspan fill="#4ec9b0">TaskCard</tspan>({ <tspan fill="#ffd479" font-weight="bold">onToggle</tspan> }: <tspan fill="#4ec9b0">TaskCardProps</tspan>) {</text>
<text xml:space="preserve" x="44" y="216" fill="#585b70" text-anchor="end">8</text>
<text xml:space="preserve" x="54" y="216" fill="#d4d4d4">  <tspan fill="#c586c0">return</tspan> (</text>
<text xml:space="preserve" x="44" y="236" fill="#585b70" text-anchor="end">9</text>
<text xml:space="preserve" x="54" y="236" fill="#d4d4d4">    &lt;button <tspan fill="#569cd6">type</tspan>=<tspan fill="#ce9178">&quot;button&quot;</tspan> onClick={<tspan fill="#ffd479" font-weight="bold">onToggle</tspan>}&gt;</text>
<text xml:space="preserve" x="44" y="256" fill="#585b70" text-anchor="end">10</text>
<text xml:space="preserve" x="54" y="256" fill="#d4d4d4">      切换完成</text>
<text xml:space="preserve" x="44" y="276" fill="#585b70" text-anchor="end">11</text>
<text xml:space="preserve" x="54" y="276" fill="#d4d4d4">    &lt;/button&gt;</text>
<text xml:space="preserve" x="44" y="296" fill="#585b70" text-anchor="end">12</text>
<text xml:space="preserve" x="54" y="296" fill="#d4d4d4">  );</text>
<text xml:space="preserve" x="44" y="316" fill="#585b70" text-anchor="end">13</text>
<text xml:space="preserve" x="54" y="316" fill="#d4d4d4">}</text>
<text xml:space="preserve" x="44" y="336" fill="#585b70" text-anchor="end">14</text>
<text xml:space="preserve" x="44" y="356" fill="#585b70" text-anchor="end">15</text>
<text xml:space="preserve" x="54" y="356" fill="#d4d4d4"><tspan fill="#c586c0">export</tspan> <tspan fill="#c586c0">default</tspan> <tspan fill="#569cd6">function</tspan> TaskPanel() {</text>
<text xml:space="preserve" x="44" y="376" fill="#585b70" text-anchor="end">16</text>
<text xml:space="preserve" x="54" y="376" fill="#d4d4d4">  <tspan fill="#569cd6">const</tspan> [done, <tspan fill="#dcdcaa">setDone</tspan>] = <tspan fill="#dcdcaa">useState</tspan>(false);</text>
<text xml:space="preserve" x="44" y="396" fill="#585b70" text-anchor="end">17</text>
<text xml:space="preserve" x="44" y="416" fill="#585b70" text-anchor="end">18</text>
<text xml:space="preserve" x="54" y="416" fill="#d4d4d4">  <tspan fill="#569cd6">function</tspan> <tspan fill="#ffd479" font-weight="bold">handleToggle</tspan>(): <tspan fill="#569cd6">void</tspan> {</text>
<text xml:space="preserve" x="44" y="436" fill="#585b70" text-anchor="end">19</text>
<text xml:space="preserve" x="54" y="436" fill="#d4d4d4">    <tspan fill="#dcdcaa">setDone</tspan>((d) =&gt; !d);</text>
<text xml:space="preserve" x="44" y="456" fill="#585b70" text-anchor="end">20</text>
<text xml:space="preserve" x="54" y="456" fill="#d4d4d4">  }</text>
<text xml:space="preserve" x="44" y="476" fill="#585b70" text-anchor="end">21</text>
<text xml:space="preserve" x="44" y="496" fill="#585b70" text-anchor="end">22</text>
<text xml:space="preserve" x="54" y="496" fill="#d4d4d4">  <tspan fill="#c586c0">return</tspan> (</text>
<text xml:space="preserve" x="44" y="516" fill="#585b70" text-anchor="end">23</text>
<text xml:space="preserve" x="54" y="516" fill="#d4d4d4">    &lt;div&gt;</text>
<text xml:space="preserve" x="44" y="536" fill="#585b70" text-anchor="end">24</text>
<text xml:space="preserve" x="54" y="536" fill="#d4d4d4">      &lt;p&gt;{done ? <tspan fill="#ce9178">&#x27;已完成&#x27;</tspan> : <tspan fill="#ce9178">&#x27;进行中&#x27;</tspan>}&lt;/p&gt;</text>
<text xml:space="preserve" x="44" y="556" fill="#585b70" text-anchor="end">25</text>
<text xml:space="preserve" x="54" y="556" fill="#d4d4d4">      &lt;<tspan fill="#4ec9b0">TaskCard</tspan> <tspan fill="#ffd479" font-weight="bold">onToggle</tspan>={<tspan fill="#ffd479" font-weight="bold">handleToggle</tspan>} /&gt;</text>
<text xml:space="preserve" x="44" y="576" fill="#585b70" text-anchor="end">26</text>
<text xml:space="preserve" x="54" y="576" fill="#d4d4d4">    &lt;/div&gt;</text>
<text xml:space="preserve" x="44" y="596" fill="#585b70" text-anchor="end">27</text>
<text xml:space="preserve" x="54" y="596" fill="#d4d4d4">  );</text>
<text xml:space="preserve" x="44" y="616" fill="#585b70" text-anchor="end">28</text>
<text xml:space="preserve" x="54" y="616" fill="#d4d4d4">}</text>
