<rect x="40" y="542" width="500" height="19" fill="#89b4fa" opacity="0.14" rx="3"/>
<text xml:space="preserve" x="44" y="76" fill="#585b70" text-anchor="end">1</text>
<text xml:space="preserve" x="54" y="76" fill="#d4d4d4"><tspan fill="#c586c0">import</tspan> { <tspan fill="#dcdcaa">useState</tspan> } <tspan fill="#c586c0">from</tspan> <tspan fill="#ce9178">&#x27;react&#x27;</tspan>;</text>
