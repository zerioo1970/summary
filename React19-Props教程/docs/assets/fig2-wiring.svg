<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="696" viewBox="0 0 1180 696" font-size="13" font-family="'DejaVu Sans Mono','Menlo','Consolas','Courier New',monospace,'Noto Sans CJK SC','Microsoft YaHei','PingFang SC'">
